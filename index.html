<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4e6e0" />
    <title>WEER — t-shirts made from the ones you already own</title>
    <meta
      name="description"
      content="A design study of a t-shirt shop: a Rotterdam studio that shreds reclaimed t-shirts into yarn and knits new ones. Invented brand, AI-written code."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8e6dd'/%3E%3Ctext x='16' y='24' font-family='Archivo, sans-serif' font-size='22' font-weight='800' text-anchor='middle' fill='%2314201c'%3EW%3C/text%3E%3C/svg%3E" />
    <script>
      // Set the theme before the first paint, so the page never flashes white.
      (function () {
        try {
          var t = localStorage.getItem("weer-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "dark" ? "#121815" : "#e4e6e0");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
